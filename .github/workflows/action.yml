name: 'GitHub Actions Weather Bot'

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v1
      
      - name: 'Get IP Address'
        run: |
          set +x
          echo "IP_ADDRESS=$(curl -s https://api64.ipify.org?format=json | jq -r '.ip')" >> $GITHUB_ENV
          set -x
      
      - name: 'Get Weather'
        run: bash ./weather.sh
        timeout-minutes: 10
      
      - name: 'Get Date'
        run: echo "REPORT_DATE=$(TZ=':Asia/Shanghai' date '+%Y-%m-%d %T')" >> $GITHUB_ENV
      
      - name: '将 IP 地址写入到 result.html'
        run: |
          if [ -n "${IP_ADDRESS}" ]; then
            echo "Github ip: ${{ env.IP_ADDRESS }}" >> result.html
          else
            echo "IP获取失败。" >> result.html
          fi
      
      - name: '读取 HTML 内容并发送邮件'
        run: |
          # 读取 result.html 内容并设置为环境变量
          echo "HTML_CONTENT<<EOF" >> $GITHUB_ENV
          cat result.html >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: 'Send mail'
        uses: dawidd6/action-send-mail@master
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true  # 添加这个，SSL 连接需要
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 气象快报 (${{ env.REPORT_DATE }})
          to: ${{ secrets.MAIL_TO }}
          from: 气象快报 <${{ secrets.MAIL_USERNAME }}>  # 修正格式
          html_body: ${{ env.HTML_CONTENT }}  # 使用 html_body 而不是 body + content_type
          convert_markdown: false  # 如果内容已经是 HTML，不要转换
